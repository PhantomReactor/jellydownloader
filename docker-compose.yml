services:
  jellydownloader:
    build: .
    image: jellydownloader
    container_name: jellydownloader
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      # Finished files + job/session state live on the host
      - ./downloads:/app/downloads
      - ./data:/app/data
      # Operator settings (port, parallel slots, pinned Jellyfin URL, cleanup)
      - ./config.json:/app/config.json
    # If Jellyfin itself listens on this same host, entering http://<host-LAN-IP>:8096
    # at login works fine from a bridged container. Should a URL ever be unreachable,
    # switch to host networking instead:
    # network_mode: host
    # (then drop the ports: mapping above)

# The server had exhausted Docker's default address pools, so this project gets an
# explicit subnet outside the usual 172.17-172.31 range.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
